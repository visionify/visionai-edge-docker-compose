version: '3.8'
# VisionAI Edge Platform - Docker Compose Configuration
# This file contains all services required for the VisionAI Edge deployment
services:

  # ============================================================================
  # AI INFERENCE SERVICES
  # ============================================================================
  
  # NVIDIA Triton Inference Server - Model serving engine
  visionai-triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: visionai-triton
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    ports:
      - '8000:8000'  # HTTP endpoint
      - '8001:8001'  # gRPC endpoint
      - '8002:8002'  # Metrics endpoint
    volumes:
      - $HOME/.visionai/models-repo:/models
    command: ["tritonserver", "--model-store=/models"]
    networks:
      - visionai-network

  # VisionAI Inference Engine - Main AI processing service
  visionai-inference:
    image: visionify/visionai-inference:hexion
    container_name: visionai-inference
    restart: always
    deploy:
      restart_policy:
        condition: always
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
    env_file:
      - ./.env
    ports:
      - '3002:3002'  # API endpoint
      - '3003:3003'  # Metrics check endpoint
    volumes:
      - ${HOME}/.visionai:/App/.visionai
    environment:
      - METRICS_PORT=3003
    networks:
      - visionai-network
    depends_on: 
      - visionai-triton
    
  visionai-inference-2:
    image: visionify/visionai-inference:hexion-ehs
    container_name: visionai-inference-2
    restart: always
    deploy:
      restart_policy:
        condition: always
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
    env_file:
      - ./.env
    ports:
      - '3004:3004'  # API endpoint
      - '3005:3005'  # Metrics check endpoint
    volumes:
      - ${HOME}/.visionai:/App/.visionai
    environment:
      - METRICS_PORT=3005
    networks:
      - visionai-network
    depends_on: 
      - visionai-triton

  # VisionAI VIT - Vision Transformer for AI processing
  visionai-vit:
    image: visionify/visionai-vit
    container_name: visionai-vit
    runtime: nvidia
    env_file:
      - ./.env
    environment:
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "2020:2020"
    command: ["python", "main.py"]
    restart: unless-stopped
    networks:
      - visionai-network
# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
networks:
  visionai-network:
    driver: bridge
    name: visionai-network

# ============================================================================
# VOLUME CONFIGURATION
# ============================================================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  hf-cache:
    driver: local

