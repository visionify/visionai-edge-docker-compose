# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
networks:
  visionai-network:
    driver: bridge
    name: visionai-network

# ============================================================================
# VOLUME CONFIGURATION
# ============================================================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  triton_models:
    driver: local
  face_data:
    driver: local
