# VisionAI Edge - Motherson HYBRID deployment
# Dashboard / control-plane / event storage run in Visionify cloud.
# Only the GPU inference stack runs on the Motherson on-prem box:
#   1. visionai-models-init  - one-shot job, copies models into the triton_models volume, exits
#   2. visionai-triton       - NVIDIA Triton model server (starts after models-init finishes)
#   3. visionai-inference    - VisionAI inference engine (starts after Triton is healthy)
#   4. visionai-watchdog     - remote kill switch: regenerate the site token in the dashboard
#                              and the watchdog removes this whole deployment (see watchdog.sh)
#
# Usage:  docker compose up -d
# Config: copy .env.example -> .env and fill in the values marked FILL.

name: visionai-edge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  # --------------------------------------------------------------------------
  # 1. Model init job - populates the triton_models volume from the models
  #    image, then exits. Re-run (docker compose up -d) to pick up new models.
  # --------------------------------------------------------------------------
  visionai-models-init:
    image: visionify/visionai-models:${MODELS_TAG:-latest}
    container_name: visionai-models-init
    restart: "no"
    logging: *default-logging
    volumes:
      - triton_models:/models
    networks:
      - visionai-network

  # --------------------------------------------------------------------------
  # 2. NVIDIA Triton Inference Server
  # --------------------------------------------------------------------------
  visionai-triton:
    image: nvcr.io/nvidia/tritonserver:${TRITON_TAG:-25.09-py3}
    container_name: visionai-triton
    restart: unless-stopped
    logging: *default-logging
    shm_size: '2gb'
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - '127.0.0.1:8000:8000'   # HTTP   (local only)
      - '127.0.0.1:8001:8001'   # gRPC   (local only)
      - '127.0.0.1:8002:8002'   # metrics (local only)
    volumes:
      - triton_models:/models
    command: ["tritonserver", "--model-store=/models"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 240s
    depends_on:
      visionai-models-init:
        condition: service_completed_successfully
    networks:
      - visionai-network

  # --------------------------------------------------------------------------
  # 3. VisionAI Inference Engine - talks to the cloud dashboard over HTTPS
  # --------------------------------------------------------------------------
  visionai-inference:
    image: visionify/visionai-inference:${VISIONAI_TAG:-latest}
    container_name: visionai-inference
    restart: unless-stopped
    logging: *default-logging
    shm_size: '2gb'
    stop_grace_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file:
      - path: ./.env
        required: false
    ports:
      - '3002:3002'             # API endpoint (LAN)
      - '127.0.0.1:3003:3003'   # metrics (local only)
    volumes:
      - ${VISIONAI_DATA_DIR:-${HOME}/.visionai}:/App/.visionai
      - triton_models:/models
    environment:
      - INSTANCE_ID=1
      - METRICS_PORT=3003
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    depends_on:
      visionai-triton:
        condition: service_healthy
    networks:
      - visionai-network

  # --------------------------------------------------------------------------
  # 4. Remote decommission watchdog - needs no access to the box.
  #    Dashboard: regenerate/delete the site API token -> cloud answers 401 ->
  #    after DECOMMISSION_AFTER_MINUTES the watchdog wipes containers, models
  #    volume, images, local data and .env, then removes itself.
  # --------------------------------------------------------------------------
  visionai-watchdog:
    image: docker:27-cli
    container_name: visionai-watchdog
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ./.env
        required: false
    environment:
      - WATCHDOG_INTERVAL_SECONDS=${WATCHDOG_INTERVAL_SECONDS:-300}
      - DECOMMISSION_AFTER_MINUTES=${DECOMMISSION_AFTER_MINUTES:-120}
      - DECOMMISSION_ENABLED=${DECOMMISSION_ENABLED:-1}
      - REPO_HOST_PATH=${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VISIONAI_DATA_DIR:-${HOME}/.visionai}:/host/visionai
      - .:/host/repo
      - ./watchdog.sh:/watchdog.sh:ro
    entrypoint: ["/bin/sh", "/watchdog.sh"]
    networks:
      - visionai-network

networks:
  visionai-network:
    driver: bridge
    name: visionai-network

volumes:
  triton_models:
    driver: local
