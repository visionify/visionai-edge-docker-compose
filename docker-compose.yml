  # ============================================================================
  # AI INFERENCE SERVICES
  # ============================================================================

  # Model init job - Copies baked models from image into triton_models volume, then exits.
  # First time: set MODELS_AZURE_BLOB_CONNECTION_STRING in .env, then run:
  #   docker compose build visionai-models-init && docker compose up -d
  # visionai-models-init:
  #   # build:
  #   #   context: ../visionai-models
  #   #   dockerfile: Dockerfile
  #   #   args:
  #   #     MODELS_AZURE_BLOB_CONNECTION_STRING: ${MODELS_AZURE_BLOB_CONNECTION_STRING}
  #   image: visionify/visionai-models:latest
  #   container_name: visionai-models-init
  #   restart: "no"
  #   volumes:
  #     - triton_models:/models
  #   networks:
  #     - visionai-network

  # NVIDIA Triton Inference Server - Waits for /models to be ready, then starts serving
  visionai-triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: visionai-triton
    restart: unless-stopped
    runtime: nvidia
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    ports:
      - '8000:8000'  # HTTP endpoint
      - '8001:8001'  # gRPC endpoint
      - '8002:8002'  # Metrics endpoint
    volumes:
      - ${HOME}/.visionai/models-repo:/models
      # - triton_models:/models
    command: ["tritonserver", "--model-store=/models"]    
    # depends_on:
    #   - visionai-models-init
    networks:
      - visionai-network

  # VisionAI Inference Engine - Main AI processing service (uncomment to enable)
  visionai-inference:
    image: visionify/visionai-inference:v2.0.3
    container_name: visionai-inference
    restart: unless-stopped
    runtime: nvidia
    env_file:
      - ./.env
    ports:
      - '3002:3002'  # API endpoint
      - '3003:3003'  # Metrics check endpoint
    volumes:
      - ${HOME}/.visionai:/App/.visionai
      - triton_models:/models
    environment:
      - INSTANCE_ID=1
      - METRICS_PORT=3003
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    networks:
      - visionai-network
    depends_on:
      - visionai-triton

  # VisionAI Face Recognition - face identification sidecar for visionai-inference.
  # Image: visionify/visionai-face (multi-arch manifest: linux/amd64 + linux/arm64, built by CI
  # in visionai-face-recognition). FACE_TAG in .env picks the tag, same scheme as inference:
  # test (head of main), uat, latest (prod release, default), a version, or sha-<commit>.
  # Inference POSTs person crops to http://visionai-face:8087/v1/identify; results come back to
  # http://visionai-inference:3008/v1/face/results. Both hops stay inside visionai-network: the
  # face API is unauthenticated, so no port is published on the host.
  # Config: cp face.env.example face.env, fill in the app URL and site token (see README).
  visionai-face:
    image: visionify/visionai-face:${FACE_TAG:-latest}
    container_name: visionai-face
    restart: unless-stopped
    runtime: nvidia
    env_file:
      - path: ./face.env
        required: false
    environment:
      - VISIONAI_FACE_RESULTS_URL=${FACE_RESULTS_URL:-http://visionai-inference:3008/v1/face/results}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - face_data:/data   # SQLite gallery of face templates; survives restarts and upgrades
    deploy:
      resources:
        limits:
          memory: 10g     # the sidecar's slice of the shared box
    networks:
      - visionai-network
    depends_on:
      - visionai-inference

