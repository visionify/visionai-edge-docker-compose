version: '3.8'

# VisionAI Edge Platform - Docker Compose Configuration
# This file contains all services required for the VisionAI Edge deployment

services:
  # ============================================================================
  # MONITORING SERVICES
  # ============================================================================
  
  # Prometheus - Metrics collection and storage
  visionai-prometheus:
    image: prom/prometheus:latest
    container_name: visionai-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - '9090:9090'
    networks:
      - visionai-network

  # # Grafana - Metrics visualization and dashboards
  visionai-grafana:
    image: grafana/grafana:latest
    container_name: visionai-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=9091
      - GF_LOG_LEVEL=info
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    depends_on:
      - visionai-prometheus
    ports:
      - '9091:9091'
    networks:
      - visionai-network

  # ============================================================================
  # AI INFERENCE SERVICES
  # ============================================================================

  # Model init job - Copies baked models from image into triton_models volume, then exits.
  # First time: set MODELS_AZURE_BLOB_CONNECTION_STRING in .env, then run:
  #   docker compose build visionai-models-init && docker compose up -d
  visionai-models-init:
    # build:
    #   context: ../visionai-models
    #   dockerfile: Dockerfile
    #   args:
    #     MODELS_AZURE_BLOB_CONNECTION_STRING: ${MODELS_AZURE_BLOB_CONNECTION_STRING}
    image: visionify/visionai-models:latest
    container_name: visionai-models-init
    restart: "no"
    volumes:
      - triton_models:/models
    networks:
      - visionai-network

  # NVIDIA Triton Inference Server - Waits for /models to be ready, then starts serving
  visionai-triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: visionai-triton
    restart: unless-stopped
    runtime: nvidia
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    ports:
      - '8000:8000'  # HTTP endpoint
      - '8001:8001'  # gRPC endpoint
      - '8002:8002'  # Metrics endpoint
    volumes:
      - triton_models:/models
    command: ["tritonserver", "--model-store=/models"]    
    depends_on:
      - visionai-models-init
    networks:
      - visionai-network

  # VisionAI Inference Engine - Main AI processing service (uncomment to enable)
  visionai-inference:
    image: visionify/visionai-inference:latest
    container_name: visionai-inference
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: always
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
    env_file:
      - ./.env
    ports:
      - '3002:3002'  # API endpoint
      - '3003:3003'  # Metrics check endpoint
    volumes:
      - ${HOME}/.visionai:/App/.visionai
      - triton_models:/models
    environment:
      - INSTANCE_ID=1
      - METRICS_PORT=3003
    networks:
      - visionai-network
    depends_on:
      - visionai-triton

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================
networks:
  visionai-network:
    driver: bridge
    name: visionai-network

# ============================================================================
# VOLUME CONFIGURATION
# ============================================================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  triton_models:
    driver: local
